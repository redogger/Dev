<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Interactor Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      min-height: 500px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .container {
      background: white;
      min-height: 500px;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .content {
      padding: 20px;
      flex: 1;
    }
    
    .status-card {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      border-right: 4px solid #667eea;
    }
    
    .status-card h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #667eea;
    }
    
    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #e9ecef;
    }
    
    .status-item:last-child {
      border-bottom: none;
    }
    
    .status-label {
      font-size: 13px;
      color: #666;
    }
    
    .status-value {
      font-size: 13px;
      font-weight: 600;
    }
    
    .status-value.active {
      color: #28a745;
    }
    
    .status-value.inactive {
      color: #dc3545;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #5a6268;
    }
    
    .btn-success {
      background: #28a745;
      color: white;
    }
    
    .btn-success:hover {
      background: #218838;
    }
    
    .btn-danger {
      background: #dc3545;
      color: white;
    }
    
    .btn-danger:hover {
      background: #c82333;
    }
    
    .action-group {
      margin-bottom: 20px;
    }
    
    .action-group h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #333;
    }
    
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    
    .quick-action-btn {
      padding: 10px;
      border: 2px solid #667eea;
      background: white;
      color: #667eea;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .quick-action-btn:hover {
      background: #667eea;
      color: white;
    }
    
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #667eea;
    }
    
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    
    .footer {
      padding: 15px 20px;
      background: #f8f9fa;
      border-top: 1px solid #e9ecef;
      text-align: center;
    }
    
    .footer a {
      color: #667eea;
      text-decoration: none;
      font-size: 12px;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    .log-container {
      max-height: 150px;
      overflow-y: auto;
      background: #f8f9fa;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
    }
    
    .log-entry {
      font-size: 11px;
      padding: 4px 0;
      border-bottom: 1px solid #e9ecef;
      color: #666;
    }
    
    .log-entry:last-child {
      border-bottom: none;
    }
    
    .log-entry.success {
      color: #28a745;
    }
    
    .log-entry.error {
      color: #dc3545;
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(102, 126, 234, 0.3);
      border-radius: 50%;
      border-top-color: #667eea;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Auto Interactor Pro</h1>
      <p>أتمتة التفاعل مع صفحات الويب</p>
    </div>
    
    <div class="content">
      <!-- Status Card -->
      <div class="status-card">
        <h3>📊 حالة النظام</h3>
        <div class="status-item">
          <span class="status-label">الحالة العامة</span>
          <span class="status-value active" id="globalStatus">نشط</span>
        </div>
        <div class="status-item">
          <span class="status-label">التبويب الحالي</span>
          <span class="status-value" id="tabStatus">-</span>
        </div>
        <div class="status-item">
          <span class="status-label">القواعد النشطة</span>
          <span class="status-value" id="rulesCount">0</span>
        </div>
      </div>
      
      <!-- Quick Actions -->
      <div class="action-group">
        <h3>⚡ إجراءات سريعة</h3>
        <div class="quick-actions">
          <button class="quick-action-btn" id="btnClick">🖱️ نقر تلقائي</button>
          <button class="quick-action-btn" id="btnFill">📝 ملء نموذج</button>
          <button class="quick-action-btn" id="btnExtract">📊 استخراج بيانات</button>
          <button class="quick-action-btn" id="btnMonitor">👁️ مراقبة</button>
        </div>
      </div>
      
      <!-- Control Buttons -->
      <div class="action-group">
        <h3>🎮 التحكم</h3>
        <button class="btn btn-primary" id="btnToggle">⏸️ إيقاف مؤقت</button>
        <button class="btn btn-success" id="btnRunRule">▶️ تشغيل القاعدة</button>
        <button class="btn btn-secondary" id="btnOptions">⚙️ الإعدادات</button>
        <button class="btn btn-danger" id="btnClearLogs">🗑️ مسح السجلات</button>
      </div>
      
      <!-- Recent Logs -->
      <div class="action-group">
        <h3>📜 آخر السجلات</h3>
        <div class="log-container" id="logContainer">
          <div class="log-entry">جاري التحميل...</div>
        </div>
      </div>
    </div>
    
    <div class="footer">
      <a href="#" id="openOptions">فتح الإعدادات المتقدمة</a>
      <br><br>
      <span style="font-size: 10px; color: #999;">الإصدار 1.0.0</span>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
