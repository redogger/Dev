version: "3.9"
services:
  greg-ide:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_JUDGE0_URL: ${JUDGE0_URL:-https://ce.judge0.com}
        NEXT_PUBLIC_ADMIN_SECRET: ${ADMIN_SECRET:-greg-admin-2024}
    container_name: greg-ide-enterprise
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_JUDGE0_URL=${JUDGE0_URL:-https://ce.judge0.com}
      - NEXT_PUBLIC_ADMIN_SECRET=${ADMIN_SECRET:-greg-admin-2024}
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget","--no-verbose","--tries=1","--spider","http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.greg-ide.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.greg-ide.entrypoints=websecure"
      - "traefik.http.routers.greg-ide.tls.certresolver=letsencrypt"
